blueprint:
  name: Zooz ZEN76 S2 Switch
  author: gregmac (updated for HA 2026.11)
  homeassistant:
    min_version: 2024.10.0
  domain: automation
  description: >-
    Setup actions for all the different key press combinations on the
    Zooz ZEN76 S2 700-series (and 800LR) switch.

    Other features:

    * Local physical control can be enabled/disabled

    * Configures important device settings on reload and on HA start:

      * Enables scene control (parameter 10)

      * Disables paddle programming mode (parameter 17, firmware 10.0+ only)
  input:
    device_id:
      name: Source
      description: >-
        The device to add automation triggers to.
        Scene Control (parameter 10) will be enabled on this device when
        automations are reloaded or Home Assistant starts.
      selector:
        device:
          multiple: false
          filter:
            - integration: zwave_js
              manufacturer: Zooz
              model: ZEN76
            - integration: zwave_js
              manufacturer: Zooz
              model: ZEN76 800LR
    local_control:
      name: "Configuration: Local physical control"
      description: >-
        Enable or disable physical paddle on/off control (also known as
        "Smart Bulb Mode").
      default: undefined
      selector:
        select:
          mode: dropdown
          options:
            - label: Do not modify configuration
              value: undefined
            - label: Physical paddle control enabled (device default)
              value: "1"
            - label: Physical paddle control disabled (control via Z-Wave only)
              value: "0"
          multiple: false
          custom_value: false
          sort: false
    button_1_1x:
      name: Paddle Up press 1x
      default: []
      selector:
        action: {}
      description: Action to run when the button is pressed one time.
    button_1_2x:
      name: Paddle Up press 2x
      default: []
      selector:
        action: {}
      description: Action to run when the button is pressed two times.
    button_1_3x:
      name: Paddle Up press 3x
      default: []
      selector:
        action: {}
      description: >-
        Action to run when the button is pressed three times.
        Note: Requires firmware 10.0+.
    button_1_4x:
      name: Paddle Up press 4x
      default: []
      selector:
        action: {}
      description: Action to run when the button is pressed four times.
    button_1_5x:
      name: Paddle Up press 5x
      default: []
      selector:
        action: {}
      description: Action to run when the button is pressed five times.
    button_1_hold:
      name: Paddle Up hold
      default: []
      selector:
        action: {}
      description: Action to run when the button is held.
    button_1_release:
      name: Paddle Up release
      default: []
      selector:
        action: {}
      description: Action to run when the button is released.
    button_2_1x:
      name: Paddle Down press 1x
      default: []
      selector:
        action: {}
      description: Action to run when the button is pressed one time.
    button_2_2x:
      name: Paddle Down press 2x
      default: []
      selector:
        action: {}
      description: Action to run when the button is pressed two times.
    button_2_3x:
      name: Paddle Down press 3x
      default: []
      selector:
        action: {}
      description: >-
        Action to run when the button is pressed three times.
        Note: Requires firmware 10.0+.
    button_2_4x:
      name: Paddle Down press 4x
      default: []
      selector:
        action: {}
      description: Action to run when the button is pressed four times.
    button_2_5x:
      name: Paddle Down press 5x
      default: []
      selector:
        action: {}
      description: Action to run when the button is pressed five times.
    button_2_hold:
      name: Paddle Down hold
      default: []
      selector:
        action: {}
      description: Action to run when the button is held.
    button_2_release:
      name: Paddle Down release
      default: []
      selector:
        action: {}
      description: Action to run when the button is released.
  source_url: https://raw.githubusercontent.com/wotelljm/HomeAssistantZoozSwitchBlueprints/refs/heads/main/zooz-zen76-s2-zwavejs.yaml
mode: parallel
max_exceeded: silent

variables:
  local_control: !input local_control
  const_scene_control_param: 10
  const_scene_control_enable: 1
  const_local_control_param: 12
  const_local_programming_param: 17
  const_local_programming_disable: 1

triggers:
  - trigger: event
    id: scene
    event_type: zwave_js_value_notification
    event_data:
      command_class_name: Central Scene
      device_id: !input device_id
  - trigger: event
    id: setup
    event_type: automation_reloaded
  - trigger: homeassistant
    id: setup
    event: start

actions:
  - variables:
      # Match on numeric fields, not label/value text, which can change between
      # Z-Wave JS versions. property_key: 1 = paddle up, 2 = paddle down.
      # value_raw: 0 pressed, 1 released, 2 held, 3 = 2x, 4 = 3x, 5 = 4x, 6 = 5x
      scene_num: "{{ trigger.event.data.property_key | int(0) if trigger.id == 'scene' else 0 }}"
      key_raw: "{{ trigger.event.data.value_raw | int(-1) if trigger.id == 'scene' else -1 }}"
  - choose:
      - conditions: "{{ trigger.id == 'setup' }}"
        sequence:
          - alias: "zwavejs: Enable scene control"
            action: zwave_js.set_config_parameter
            continue_on_error: true
            target:
              device_id: !input device_id
            data:
              parameter: "{{ const_scene_control_param }}"
              value: "{{ const_scene_control_enable }}"
          - alias: "zwavejs: Disable local programming to allow 3-press actions (firmware 10.0+)"
            action: zwave_js.set_config_parameter
            continue_on_error: true
            target:
              device_id: !input device_id
            data:
              parameter: "{{ const_local_programming_param }}"
              value: "{{ const_local_programming_disable }}"
          - if: "{{ local_control != 'undefined' }}"
            then:
              - alias: "zwavejs: Setup local control"
                action: zwave_js.set_config_parameter
                continue_on_error: true
                target:
                  device_id: !input device_id
                data:
                  parameter: "{{ const_local_control_param }}"
                  value: "{{ local_control | int }}"
      - conditions: "{{ scene_num == 1 }}"
        sequence:
          - choose:
              - conditions: "{{ key_raw == 0 }}"
                sequence: !input button_1_1x
              - conditions: "{{ key_raw == 3 }}"
                sequence: !input button_1_2x
              - conditions: "{{ key_raw == 4 }}"
                sequence: !input button_1_3x
              - conditions: "{{ key_raw == 5 }}"
                sequence: !input button_1_4x
              - conditions: "{{ key_raw == 6 }}"
                sequence: !input button_1_5x
              - conditions: "{{ key_raw == 2 }}"
                sequence: !input button_1_hold
              - conditions: "{{ key_raw == 1 }}"
                sequence: !input button_1_release
      - conditions: "{{ scene_num == 2 }}"
        sequence:
          - choose:
              - conditions: "{{ key_raw == 0 }}"
                sequence: !input button_2_1x
              - conditions: "{{ key_raw == 3 }}"
                sequence: !input button_2_2x
              - conditions: "{{ key_raw == 4 }}"
                sequence: !input button_2_3x
              - conditions: "{{ key_raw == 5 }}"
                sequence: !input button_2_4x
              - conditions: "{{ key_raw == 6 }}"
                sequence: !input button_2_5x
              - conditions: "{{ key_raw == 2 }}"
                sequence: !input button_2_hold
              - conditions: "{{ key_raw == 1 }}"
                sequence: !input button_2_release
